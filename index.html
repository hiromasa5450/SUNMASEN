<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ① ビューポート固定：ユーザーによるスケール操作を禁止（設計書 15.1） -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スンマ戦</title>
<style>
  /* ② html/body レベルでタッチ操作を制御（設計書 15.1） */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a12;
    touch-action: none;            /* ブラウザ既定のパン・ズームを無効化 */
    overscroll-behavior: none;     /* バウンススクロール（iOS）も無効化 */
    -webkit-user-select: none;     /* テキスト選択によるズームを防止 */
    user-select: none;
    overflow: hidden;              /* スクロールバーを非表示 */
    -webkit-tap-highlight-color: transparent;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* ③ ゲームCanvas自体にも念のため設定（設計書 15.1） */
  canvas {
    touch-action: none;
    display: block;
    background: #1a2238;
    max-width: 100%; max-height: 100%;
  }
  #rotate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #0a0a12; color: #fff; font-size: 20px; text-align: center; z-index: 10;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
  <div id="rotate">📱 横向きにしてください<br>スンマ戦は横画面専用です</div>

<script>
/* ④⑤ ダブルタップ／ピンチズームを preventDefault で完全遮断（設計書 15.1） */
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
let __lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - __lastTouchEnd < 300) e.preventDefault();
  __lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
<!-- ネット対戦（任意）：Firebase設定があれば有効化。未設定ならローカルCPU対戦にフォールバック -->
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
